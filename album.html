  <!-- Album loader + Lightbox -->
  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    const slug = (params.get('slug') || params.get('album') || '').trim();
    const titleEl = document.getElementById('albumTitle');
    const metaEl  = document.getElementById('albumMeta');
    const gridEl  = document.getElementById('photo-grid');
    const emptyEl = document.getElementById('emptyMsg');
    if (!slug){ titleEl.textContent='Album not specified'; emptyEl.style.display='block'; return; }

    const base = `/assets/albums/${slug}`;

    function toWebp(filename){
  return String(filename).replace(/\.(jpe?g|png)$/i, '.webp');
}

function webSrc(src){
  if (!src) return '';
  if (/^https?:\/\//i.test(src) || src.startsWith('/')) return src;
  const clean = src.replace(/^photos\//, '');
  return `${base}/web/${toWebp(clean)}`;
}

function fullSrc(src){
  if (!src) return '';
  if (/^https?:\/\//i.test(src) || src.startsWith('/')) return src;
  const clean = src.replace(/^photos\//, '');
  return `${base}/full/${toWebp(clean)}`;
}

    let files = [];   // [{src, alt}]
    let current = 0;

    // Load the per-album list
    const s = document.createElement('script');
    s.src = `${base}/photos.js`;
    s.onload = render;
    s.onerror = () => { titleEl.textContent='Album not found'; emptyEl.style.display='block'; };
    document.head.appendChild(s);
let lastRaw = [];
let highlightsTried = false;

function maybeSetupHighlights(){
  if (highlightsTried) return;
  // if highlights.js loaded, window.HIGHLIGHTS should exist (array)
  // if highlights.js missing, we still want fallback -> call anyway
  highlightsTried = true;
  setupHighlights(lastRaw);
}

// Load optional highlights list (per album)
const hs = document.createElement('script');
hs.src = `${base}/highlights.js`;
hs.onload = () => {
  // highlights are now available -> use them
  maybeSetupHighlights();
};
hs.onerror = () => {
  // no highlights file -> allow fallback
  maybeSetupHighlights();
};
document.head.appendChild(hs);


    // Helpers
    function normalize(list){
  return (list || []).map(item => {
    if (typeof item === 'string') {
      return {
        src: webSrc(item),
        full: fullSrc(item),
        alt: ''
      };
    }

    if (item && typeof item === 'object') {
      const src = item.src || item.file || item.path || '';
      return {
        src: webSrc(src),
        full: fullSrc(src),
        alt: item.alt || ''
      };
    }

    return null;
  }).filter(Boolean);
}
    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

  // Turn filenames into absolute URLs
async function render(){
  let raw = [];
  if (Array.isArray(window.PHOTOS)) raw = window.PHOTOS;
  else if (Array.isArray(window.photos)) raw = window.photos;
  else if (window.NOCH_PHOTOS && Array.isArray(window.NOCH_PHOTOS[slug])) raw = window.NOCH_PHOTOS[slug];

  lastRaw = raw;

  files = normalize(raw);

  const isIOSSafari =
  /iP(hone|od|ad)/.test(navigator.platform) ||
  (/Mac/.test(navigator.platform) && navigator.maxTouchPoints > 1);

const loadingAttr = isIOSSafari ? "eager" : "lazy";

  titleEl.textContent = slugToTitle(slug);
  metaEl.textContent  = `${files.length} photos`;

 // If highlights.js already finished loading (or failed), we can init now.
// Otherwise hs.onload/hs.onerror will call it.
if (highlightsTried) {
  setupHighlights(lastRaw);
}


  // Render grid
  gridEl.innerHTML = files.map((f,i) => `
    <figure class="photo-card" data-idx="${i}" role="button" tabindex="0" style="position:relative; cursor:zoom-in;">
      <img loading="${loadingAttr}" decoding="async" src="${f.src}" alt="${escapeHtml(f.alt)}">
      <button class="download-btn" onclick="event.stopPropagation(); downloadImage('${f.full || f.src}')" aria-label="Download photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </figure>
  `).join('');

  // Portrait detection (adds .portrait)
  gridEl.querySelectorAll('figure').forEach(fig => {
    const img = fig.querySelector('img');
    if (!img) return;

    const apply = () => {
      if (img.naturalHeight > img.naturalWidth) fig.classList.add('portrait');
    };

    if (img.complete) apply();
    else img.addEventListener('load', apply, { once:true });
  });

  // Click to zoom + keyboard
  gridEl.querySelectorAll('figure[data-idx]').forEach(fig => {
    fig.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      openLightbox(Number(fig.dataset.idx));
    });

    fig.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightbox(Number(fig.dataset.idx));
      }
    });
  });
}

function normalizeHighlights(list){
  return (list || []).map(src => {
    if (!src) return null;
    const s = (typeof src === "string") ? src : (src.src || src.file || src.path || "");
    if (!s) return null;
    return webSrc(s);
  }).filter(Boolean);
}


function setupHighlights(rawList){
  const wrap = document.getElementById('highlights');
  const a = document.getElementById('hi-a');
  const b = document.getElementById('hi-b');
  const dotsEl = document.getElementById('hi-dots');

  if (!wrap || !a || !b || !dotsEl) return;

let hiRaw = (Array.isArray(window.HIGHLIGHTS) && window.HIGHLIGHTS.length)
  ? window.HIGHLIGHTS
  : [];


  // fallback: first 4 photos
  if (!hiRaw.length){
    hiRaw = (rawList || [])
      .slice(0,4)
      .map(x => (typeof x === "string" ? x : x?.src))
      .filter(Boolean);
  }

  const hi = normalizeHighlights(hiRaw).slice(0,4);
  
  if (!hi.length) return;

  wrap.hidden = false;

  document.body.style.setProperty('--album-bg-url', `url("${hi[0]}")`);


  // Use the highlight image as the blurred page background
document.documentElement.style.setProperty('--album-bg', `url("${hi[0]}")`);


  // premium "lines" indicators
  dotsEl.innerHTML = hi.map((_,i)=>`<span class="hi-dot" data-i="${i}"></span>`).join('');
  const dots = [...dotsEl.querySelectorAll('.hi-dot')];

  let idx = 0;
  let showingA = true;
  let timer = null;

  // set frame ratio depending on current image (landscape 16:9, portrait 4:5)
  function setRatioByImage(img){
    const frame = wrap.querySelector('.highlights-frame');
    if (!frame || !img?.naturalWidth || !img?.naturalHeight) return;
    const isPortrait = img.naturalHeight > img.naturalWidth;
    frame.classList.toggle('is-portrait', isPortrait);
  }

  function paintDots(){
    dots.forEach((d,k)=>d.classList.toggle('on', k===idx));
  }

  function show(i){
    idx = (i + hi.length) % hi.length;
    const nextSrc = hi[idx];

    document.body.style.setProperty('--album-bg-url', `url("${nextSrc}")`);
    document.documentElement.style.setProperty('--album-bg', `url("${nextSrc}")`);


    const top = showingA ? a : b;
    const under = showingA ? b : a;

    // load into under first, then crossfade
    under.classList.remove('is-on');
    under.src = nextSrc;

    under.onload = () => {
      setRatioByImage(under);

      // crossfade
      under.classList.add('is-on');
      top.classList.remove('is-on');

      showingA = !showingA;
      paintDots();
    };

    under.onerror = () => {
      // if a highlight image breaks, skip it
      show(idx + 1);
    };
  }

  function start(){
    stop();
    timer = setInterval(()=> show(idx + 1), 3600);
  }
  function stop(){
    if (timer) clearInterval(timer);
    timer = null;
  }

  // init
  a.classList.add('is-on');
  b.classList.remove('is-on');
  show(0);
  start();

  // swipe (mobile)
  let sx=0, sy=0;
  wrap.addEventListener('touchstart', (e)=>{
    const t=e.changedTouches[0];
    sx=t.clientX; sy=t.clientY;
    stop();
  }, { passive:true });

  wrap.addEventListener('touchend', (e)=>{
    const t=e.changedTouches[0];
    const dx=t.clientX - sx;
    const dy=t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2){
      if (dx < 0) show(idx + 1);
      else show(idx - 1);
    }
    start();
  }, { passive:true });
}


    // ---------- Lightbox ----------
    const lb = document.getElementById('lightbox');
    const lbA = document.getElementById('lb-img-a');
const lbB = document.getElementById('lb-img-b');
let showingA = true;
    const lbCap = document.getElementById('lb-cap');
    const btnPrev = document.getElementById('lb-prev');
    const btnNext = document.getElementById('lb-next');
    const btnClose= document.getElementById('lb-close');
    const lbDownload = document.getElementById('lb-download');

    const swipeBar = document.getElementById('lb-swipebar');

function showSwipeBarOnce(){
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!isTouch) return;

  if (sessionStorage.getItem('nocharte_swipebar_shown') === '1') return;
  sessionStorage.setItem('nocharte_swipebar_shown', '1');

  if (!swipeBar) return;

  swipeBar.classList.remove('is-hide');
  swipeBar.classList.add('is-show');

  setTimeout(() => {
    swipeBar.classList.remove('is-show');
    swipeBar.classList.add('is-hide');
  }, 2300);
}


    lbDownload.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (files[current]) downloadImage(files[current].full || files[current].src);
});


    btnPrev.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); prev(); });
btnNext.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); next(); });
btnClose.addEventListener('click', (e) => { 
  e.preventDefault(); 
  e.stopPropagation(); 
  closeLightbox(); 
});

    function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }

    function closeLightbox(){
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lb-open');
  removeEvents();
}

   function openLightbox(i){
  current = clamp(i, 0, files.length - 1);

  // Prevent browser scroll jump
  const scrollY = window.scrollY;

  lb.classList.add('open');
  lb.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lb-open');

  showSwipeBarOnce();


  addEvents();

  // IMPORTANT: always use show() so next/prev works
  show(current);

  window.scrollTo(0, scrollY);
}

    function show(i){
  if (!files.length) return;
  current = clamp(i, 0, files.length-1);
  const f = files[current];

  const top = showingA ? lbA : lbB;
  const under = showingA ? lbB : lbA;

  // load into the hidden one first
  under.classList.remove('is-on');
  under.alt = f.alt || '';

  // start loading new src
  under.src = f.full || f.src;

  under.onload = () => {
    // crossfade
    under.classList.add('is-on');
    top.classList.remove('is-on');
    showingA = !showingA;

    lbCap.textContent = f.alt || '';
  };

  // prefetch neighbors
  const n1 = (current + 1) % files.length;
  const n2 = (current - 1 + files.length) % files.length;
  [n1,n2].forEach(k => {
  const im = new Image();
  im.src = files[k].full || files[k].src;
});
}

    function next(){ if (files.length) show((current + 1) % files.length); }
    function prev(){ if (files.length) show((current - 1 + files.length) % files.length); }

    function onKey(e){
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft')  prev();
    }

    function onBackdrop(e){
  const clickedImage = e.target.closest('#lb-img-a, #lb-img-b');
  const clickedNavBtn = e.target.closest('.lb-btn');
  const clickedClose = e.target.closest('#lb-close');
  const clickedActions = e.target.closest('#lb-actions');

  if (clickedImage || clickedNavBtn || clickedClose || clickedActions) return;
  closeLightbox();
}


    // --- Swipe support (mobile) ---
let startX = 0, startY = 0;

function onTouchStart(e){
  if (!lb.classList.contains('open')) return;
  const t = e.changedTouches[0];
  startX = t.clientX;
  startY = t.clientY;
}

function onTouchEnd(e){
  if (!lb.classList.contains('open')) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;

  // horizontal swipe only (ignore vertical)
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2){
    if (dx < 0) next();  // swipe left => next
    else prev();         // swipe right => prev
  }
}

function addEvents(){
  document.addEventListener('keydown', onKey);
  lb.addEventListener('click', onBackdrop);

  // mobile swipe
  lb.addEventListener('touchstart', onTouchStart, { passive: true });
  lb.addEventListener('touchend', onTouchEnd, { passive: true });
}

function removeEvents(){
  document.removeEventListener('keydown', onKey);
  lb.removeEventListener('click', onBackdrop);

  // mobile swipe
  lb.removeEventListener('touchstart', onTouchStart);
  lb.removeEventListener('touchend', onTouchEnd);
}
    // Title helper
    function slugToTitle(s){
      const parts = s.split('-'); const words=[], nums=[];
      for(const p of parts){ (/^\d+$/.test(p)?nums:words).push(p); }
      const name = words.map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
      return name + (nums.length ? ' — ' + nums.join(' ') : '');
    }
  })();
  </script>

  <!-- Watermark download -->
  <script>
  async function downloadImage(imgSrc) {
    const logoSrc = '/assets/web/logo.png';
    const img = await loadImage(imgSrc);
    const logo = await loadImage(logoSrc);

    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(img, 0, 0);

    const aspect = img.width / img.height;
    let logoWidth = aspect > 1.4 ? img.width*0.12 : aspect < 0.9 ? img.width*0.22 : img.width*0.18;

    const logoHeight = logo.height * (logoWidth / logo.width);
    ctx.globalAlpha = 0.6;
    ctx.drawImage(logo, img.width - logoWidth - 20, img.height - logoHeight - 20, logoWidth, logoHeight);
    ctx.globalAlpha = 1;

    const link = document.createElement('a');
    link.download = 'nocharte-photo.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  }
  function loadImage(src){
    return new Promise((res, rej)=>{
      const i = new Image();
      i.crossOrigin = 'anonymous';
      i.onload = ()=>res(i);
      i.onerror = rej;
      i.src = src;
    });
  }
  </script>

  <!-- Mark current link + carry ?skip-intro=1 -->
  <script>
    (function(){
      try{
        const here = (location.pathname.replace(/\/+$/, '') || '/album.html').toLowerCase();
        const mark = scope => scope && scope.querySelectorAll('a[href]').forEach(a=>{
          const p = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '').toLowerCase();
          if (p === here) a.setAttribute('aria-current','page');
        });
        mark(document.querySelector('.links'));
        mark(document.getElementById('nav-pop'));
      }catch(e){}
      document.addEventListener('click', function (e) {
        const a = e.target.closest('a[href]');
        if (!a) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (a.target === '_blank') return;
        const href = a.getAttribute('href') || '';
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;
        const url = new URL(href, location.href);
        if (url.origin !== location.origin) return;
        e.preventDefault();
        url.searchParams.set('skip-intro','1');
        location.assign(url.href);
      }, { capture: true });
    })();
  </script>
</body>
</html>
