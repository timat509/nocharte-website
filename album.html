  <!-- Page-specific spacing override (tweak +56px as needed) -->

    @media (min-width:821px){
      :root{ --album-top-gap: calc(var(--nav-h) + 56px); }
      .page-album .wrap{ padding-top: var(--album-top-gap) !important; }
    }
    @media (max-width:820px){
      .page-album .wrap{
        padding-top: calc(var(--mobile-header-h) + 16px) !important;
      }
    }
    /* tiny safeguard: hide obviously broken img nodes */
    img:where([src=""],[src="#"],[src="null"],[src="undefined"]){ display:none !important; }

<body class="page-album">
  <!-- HEADER -->
  <header class="nav" role="banner">
    <a class="logo" href="/index.html" aria-label="NOCHARTE Home">
      <img src="/assets/web/logohome.png" alt="NOCHARTE" />
    </a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="links" role="navigation" aria-label="Main">
      <a href="/index.html"  data-nav="home">Home</a>
      <a href="/gallery.html" data-nav="gallery">Gallery</a>
      <a href="/about.html"   data-nav="about">About</a>
      <a href="/contact.html" data-nav="contact">Contact</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="album-head">
      <a class="back" href="/gallery.html">← Back to Gallery</a>
      <div>
        <h1 id="albumTitle" class="album-title">Loading…</h1>
        <p id="albumMeta" class="album-meta"></p>
      </div>
    </div>

    <section id="photo-grid" class="grid" aria-live="polite"></section>
    <p id="emptyMsg" class="empty" style="display:none">No photos found for this album.</p>
  </main>

  <!-- POPUP MENU (required for the mobile menu to work) -->
<div id="nav-pop" class="nav-pop" hidden aria-modal="true" role="dialog">
  <div class="nav-pop__overlay" data-close></div>

  <!-- Close (X) -->
  <button class="nav-pop__close" aria-label="Close menu" data-close>
    <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
      <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="nav-pop__sheet" role="document">
    <nav class="nav-pop__nav" aria-label="Main">
      <a href="/index.html">Home</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </div>
</div>

<script>
// Underline "Gallery" when we're on /album.html
(function () {
  const isAlbum = /\/album\.html(?:$|[?#])/.test(location.pathname + location.search);
  if (!isAlbum) return;

  // Header links (desktop)
  document.querySelectorAll('.links a[data-nav="gallery"], .links a[href$="/gallery.html"]')
    .forEach(a => { a.setAttribute('aria-current', 'page'); a.classList.add('active'); });

  // Popup menu links (mobile)
  document.querySelectorAll('#nav-pop a[data-nav="gallery"], #nav-pop a[href$="/gallery.html"]')
    .forEach(a => { a.setAttribute('aria-current', 'page'); a.classList.add('active'); });
})();
</script>


  <!-- Lightbox -->
  <div id="lightbox" class="lb" aria-hidden="true" role="dialog" aria-label="Image viewer">
    <div class="lb-inner">
      <img id="lb-img" class="lb-img" alt="" />
    </div>
    <div id="lb-cap" class="lb-cap"></div>
    <button type="button" id="lb-prev" class="lb-btn lb-prev" aria-label="Previous (←)">❮</button>
    <button type="button" id="lb-next" class="lb-btn lb-next" aria-label="Next (→)">❯</button>
    <button type="button" id="lb-close" class="lb-close" aria-label="Close (Esc)">✕</button>
  </div>

  <!-- Album loader + Lightbox -->
  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    const slug = (params.get('slug') || params.get('album') || '').trim();
    const titleEl = document.getElementById('albumTitle');
    const metaEl  = document.getElementById('albumMeta');
    const gridEl  = document.getElementById('photo-grid');
    const emptyEl = document.getElementById('emptyMsg');
    if (!slug){ titleEl.textContent='Album not specified'; emptyEl.style.display='block'; return; }

    const base = `/assets/albums/${slug}`;
    let files = [];   // [{src, alt}]
    let current = 0;

    // Load the per-album list
    const s = document.createElement('script');
    s.src = `${base}/photos.js`;
    s.onload = render;
    s.onerror = () => { titleEl.textContent='Album not found'; emptyEl.style.display='block'; };
    document.head.appendChild(s);

    // Helpers
    function normalize(list){
      return (list || []).map(item => {
        if (typeof item === 'string') return { src: item, alt: '' };
        if (item && typeof item === 'object') {
          const src = item.src || item.file || item.path || '';
          return { src, alt: item.alt || '' };
        }
        return null;
      }).filter(Boolean).map(({src, alt}) => {
        const absolute = /^https?:\/\//i.test(src) || src.startsWith('/');
        const prefixed = src.startsWith('photos/');
        const finalSrc = absolute ? src : (prefixed ? `${base}/${src}` : `${base}/photos/${src}`);
        return { src: finalSrc, alt };
      });
    }
    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function probe(src, timeout=7000){
      return new Promise(res=>{
        const t = setTimeout(()=>res(false), timeout);
        const im = new Image();
        im.onload = ()=>{ clearTimeout(t); res(true); };
        im.onerror = ()=>{ clearTimeout(t); res(false); };
        im.src = src;
      });
    }

    // Main render
    async function render(){
      let raw = [];
      if (Array.isArray(window.PHOTOS)) raw = window.PHOTOS;
      else if (Array.isArray(window.photos)) raw = window.photos;
      else if (window.NOCH_PHOTOS && Array.isArray(window.NOCH_PHOTOS[slug])) raw = window.NOCH_PHOTOS[slug];

      // absolute URLs
      const all = normalize(raw);

      // Keep only images that actually load (skip deleted/missing)
      const ok = await Promise.all(all.map(f => probe(f.src)));
      files = all.filter((_,i)=>ok[i]);

      if (!files.length){
        titleEl.textContent = slugToTitle(slug);
        metaEl.textContent  = '0 photos';
        emptyEl.style.display='block';
        return;
      }

      titleEl.textContent = slugToTitle(slug);
      metaEl.textContent  = `${files.length} photos`;

      gridEl.innerHTML = files.map((f,i) => `
        <figure class="photo-card" data-idx="${i}" role="button" tabindex="0" style="position:relative; cursor:zoom-in;">
          <img loading="lazy" decoding="async" crossorigin="anonymous" src="${f.src}" alt="${escapeHtml(f.alt)}">
          <button class="download-btn" onclick="event.stopPropagation(); downloadImage('${f.src}')" aria-label="Download photo">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
        </figure>
      `).join('');

      // Remove tiles that later error (and keep lightbox indexes in sync)
      gridEl.querySelectorAll('figure[data-idx]').forEach(fig=>{
        const idx = Number(fig.dataset.idx);
        const img = fig.querySelector('img');

        img.addEventListener('error', ()=>{
          const i = Number(fig.dataset.idx);
          files.splice(i,1);
          fig.remove();
          reindex();
          if (lb.classList.contains('open')){
            if (!files.length) closeLightbox();
            else show(clamp(current, 0, files.length-1));
          }
        });

        fig.addEventListener('click', ()=>openLightbox(idx));
        fig.addEventListener('keydown', e=>{
          if (e.key==='Enter' || e.key===' ') { e.preventDefault(); openLightbox(Number(fig.dataset.idx)); }
        });
      });
    }

    function reindex(){
      gridEl.querySelectorAll('figure[data-idx]').forEach((fig,i)=>{ fig.dataset.idx = i; });
      metaEl.textContent = `${files.length} photos`;
      current = clamp(current, 0, Math.max(0, files.length-1));
    }

    // ---------- Lightbox ----------
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCap = document.getElementById('lb-cap');
    const btnPrev = document.getElementById('lb-prev');
    const btnNext = document.getElementById('lb-next');
    const btnClose= document.getElementById('lb-close');

    function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }

    function openLightbox(i){
      if (!files.length) return;
      current = clamp(i, 0, files.length-1);
      show(current);
      lb.classList.add('open');
      lb.setAttribute('aria-hidden','false');
      btnClose.focus();
      addEvents();
    }
    function closeLightbox(){
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden','true');
      removeEvents();
    }
    function show(i){
      if (!files.length) return;
      current = clamp(i, 0, files.length-1);
      const f = files[current];
      lbImg.src = f.src;
      lbImg.alt = f.alt || '';
      lbCap.textContent = f.alt || '';

      // prefetch neighbors
      const n1 = (current + 1) % files.length;
      const n2 = (current - 1 + files.length) % files.length;
      [n1,n2].forEach(k => { const im = new Image(); im.src = files[k].src; });
    }
    function next(){ if (files.length) show((current + 1) % files.length); }
    function prev(){ if (files.length) show((current - 1 + files.length) % files.length); }

    function onKey(e){
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') next();
      else if (e.key === 'ArrowLeft')  prev();
    }
    function onBackdrop(e){
      if (!e.target.closest('.lb-img, .lb-btn, .lb-close')) closeLightbox();
    }
    function addEvents(){
      document.addEventListener('keydown', onKey);
      lb.addEventListener('click', onBackdrop);
    }
    function removeEvents(){
      document.removeEventListener('keydown', onKey);
      lb.removeEventListener('click', onBackdrop);
    }
    btnPrev.addEventListener('click', prev);
    btnNext.addEventListener('click', next);
    btnClose.addEventListener('click', closeLightbox);

    // Title helper
    function slugToTitle(s){
      const parts = s.split('-'); const words=[], nums=[];
      for(const p of parts){ (/^\d+$/.test(p)?nums:words).push(p); }
      const name = words.map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
      return name + (nums.length ? ' — ' + nums.join(' ') : '');
    }
  })();
  </script>

  <!-- Watermark download -->
  <script>
  async function downloadImage(imgSrc) {
    const logoSrc = '/assets/web/logo.png';
    const img = await loadImage(imgSrc);
    const logo = await loadImage(logoSrc);

    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(img, 0, 0);

    const aspect = img.width / img.height;
    let logoWidth = aspect > 1.4 ? img.width*0.12 : aspect < 0.9 ? img.width*0.22 : img.width*0.18;

    const logoHeight = logo.height * (logoWidth / logo.width);
    ctx.globalAlpha = 0.6;
    ctx.drawImage(logo, img.width - logoWidth - 20, img.height - logoHeight - 20, logoWidth, logoHeight);
    ctx.globalAlpha = 1;

    const link = document.createElement('a');
    link.download = 'nocharte-photo.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  }
  function loadImage(src){
    return new Promise((res, rej)=>{
      const i = new Image();
      i.crossOrigin = 'anonymous';
      i.onload = ()=>res(i);
      i.onerror = rej;
      i.src = src;
    });
  }
  </script>

  <!-- Mark current link + carry ?skip-intro=1 -->
  <script>
    (function(){
      try{
        const here = (location.pathname.replace(/\/+$/, '') || '/album.html').toLowerCase();
        const mark = scope => scope && scope.querySelectorAll('a[href]').forEach(a=>{
          const p = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '').toLowerCase();
          if (p === here) a.setAttribute('aria-current','page');
        });
        mark(document.querySelector('.links'));
        mark(document.getElementById('nav-pop'));
      }catch(e){}
      document.addEventListener('click', function (e) {
        const a = e.target.closest('a[href]');
        if (!a) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (a.target === '_blank') return;
        const href = a.getAttribute('href') || '';
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;
        const url = new URL(href, location.href);
        if (url.origin !== location.origin) return;
        e.preventDefault();
        url.searchParams.set('skip-intro','1');
        location.assign(url.href);
      }, { capture: true });
    })();
  </script>
</body>
</html>
