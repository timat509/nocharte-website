<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicons -->
<link rel="icon" href="/websitelogo/weblogo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/websitelogo/weblogo250px.png" sizes="32x32">
<link rel="apple-touch-icon" href="/websitelogo/weblogo250px.png" sizes="180x180">

<!-- Open Graph (link previews) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://nocharte.com/">
<meta property="og:site_name" content="NOCHARTE">
<meta property="og:title" content="NOCHARTE — We Frame the Feeling">
<meta property="og:description" content="Nightlife & event photography. Fast, precise, on brand.">
<meta property="og:image" content="https://nocharte.com/websitelogo/weblogo1250px.png">
<meta property="og:image:width" content="1250">
<meta property="og:image:height" content="1250">

<!-- Twitter card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NOCHARTE — We Frame the Feeling">
<meta name="twitter:description" content="Nightlife & event photography. Fast, precise, on brand.">
<meta name="twitter:image" content="https://nocharte.com/websitelogo/weblogo1250px.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NOCHARTE — Contact</title>
  <meta name="description" content="Contact NOCHARTE to book nightlife photography. Fast, precise, and on brand.">

  <!-- Fonts & CSS -->
  <link href="https://fonts.cdnfonts.com/css/glacial-indifference" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=2025-09-16-2" />
  <link rel="stylesheet" href="/contact.css">
  <link rel="stylesheet" href="/mobile/responsive.css?v=2025-09-16-2" />
  <script src="/mobile/mobile.js?v=2025-09-16-2" defer></script>
</head>

<body class="page-contact">
  <!-- HEADER -->
  <header class="nav" role="banner">
    <a class="logo" href="/index.html" aria-label="NOCHARTE Home">
      <img src="/assets/web/logohome.png" alt="NOCHARTE" />
    </a>

    <!-- Mobile hamburger -->
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Fallback inline links (desktop; mobile popup handles nav) -->
    <nav class="links" role="navigation" aria-label="Main">
      <a href="/index.html"  data-nav="home">Home</a>
      <a href="/gallery.html" data-nav="gallery">Gallery</a>
      <a href="/about.html"   data-nav="about">About</a>
      <a href="/contact.html" data-nav="contact">Contact</a>
    </nav>
  </header>

  <!-- POPUP MENU (single instance; close button OUTSIDE the sheet) -->
  <div id="nav-pop" class="nav-pop" hidden aria-modal="true" role="dialog">
    <div class="nav-pop__overlay" data-close></div>

    <!-- Close (X) -->
    <button class="nav-pop__close" aria-label="Close menu" data-close>
      <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="nav-pop__sheet" role="document">
      <nav class="nav-pop__nav" aria-label="Main">
        <a href="/index.html">Home</a>
        <a href="/gallery.html">Gallery</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </div>

  <main class="wrap">
    <!-- HERO -->
    <section class="contact-hero v2" aria-label="Contact hero">
      <div class="hero-bg">
        <div class="bg-gradient"></div>
        <div class="bg-light"></div>
      </div>

      <div class="hero-content">
        <h1 class="hero-title" title="Contact"><span>CONTACT</span></h1>
        <p class="hero-tag" id="heroTag"
           data-phrases='[
             "Tell us the date, the vibe, and the must-haves.",
             "We’ll frame the night and keep it stress-free.",
             "Fast delivery. On-brand color. No drama."
           ]'>
          Tell us the date, the vibe, and the must-haves. We’ll handle the rest.
        </p>
        <p class="breadcrumbs"><a href="/index.html">Home</a> › Contact</p>
      </div>
    </section>

    <!-- QUICK CONTACT -->
    <section class="cards" aria-label="Quick contact options">
      <a class="card" href="mailto:nocharte@gmail.com">
        <div class="card-title">Email</div>
        <div class="card-sub">nocharte@gmail.com</div>
        <div class="card-foot">Open email →</div>
      </a>
      <a class="card" href="https://instagram.com/nocharte_entertainment" target="_blank" rel="noopener">
        <div class="card-title">Instagram</div>
        <div class="card-sub">@nocharte_entertainment</div>
        <div class="card-foot">DM us →</div>
      </a>
    </section>

    <!-- FORM -->
    <section class="contact-form" aria-label="Booking form">
      <h2 class="form-title">Book NOCHARTE</h2>

      <form id="bookingForm" class="form" method="post" action="" enctype="multipart/form-data" novalidate>
        <!-- spam trap -->
        <input type="text" name="website" class="hp" autocomplete="off" tabindex="-1" aria-hidden="true"/>

        <div class="grid">
          <label class="field">
            <span>Name*</span>
            <input type="text" name="name" required placeholder="Your name" autocomplete="name"/>
          </label>

          <label class="field">
            <span>Email*</span>
            <input type="email" name="email" required placeholder="you@email.com" autocomplete="email"/>
          </label>

          <label class="field">
            <span>Event Date</span>
            <input type="date" name="date" inputmode="none"/>
          </label>

          <label class="field">
            <span>Budget (approx.)</span>
            <select name="budget">
              <option value="">Select</option>
              <option>Under €300</option>
              <option>€300–€600</option>
              <option>€600–€1,000</option>
              <option>€1,000+</option>
            </select>
          </label>

          <label class="field span-2">
            <span>Venue / City</span>
            <input type="text" name="venue" placeholder="Club or location" autocomplete="organization"/>
          </label>

          <label class="field span-2">
            <span>Message*</span>
            <textarea name="message" rows="6" required placeholder="Tell us the vibe, timings, and must-capture moments..."></textarea>
          </label>

          <label class="field file-field">
            <span>Attachment (moodboard, brief)</span>
            <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png"/>
          </label>

          <label class="check">
            <input type="checkbox" name="consent" required />
            <span>I agree to be contacted about this request.</span>
          </label>
        </div>

        <button class="btn" type="submit">Send Request</button>
        <p class="mailto-fallback">Prefer email? <a href="mailto:nocharte@gmail.com?subject=Booking%20Inquiry%20-%20NOCHARTE">nocharte@gmail.com</a></p>
        <p id="formStatus" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <!-- Floating vertical “CONTACT” outline -->
  <div class="contact-floating-accent" aria-hidden="true">
    <svg viewBox="0 0 800 160" class="accent-svg" role="img" aria-label="Contact">
      <defs>
        <linearGradient id="strokeWave" x1="0" y1="-300" x2="0" y2="300" gradientUnits="userSpaceOnUse">
          <stop offset="0%"  stop-color="#b47bff"/>
          <stop offset="50%" stop-color="#5193ff"/>
          <stop offset="100%" stop-color="#b47bff"/>
          <animateTransform attributeName="gradientTransform" type="translate" values="0,-300; 0,300; 0,-300" dur="7s" repeatCount="indefinite"/>
        </linearGradient>
        <mask id="textStrokeMask">
          <rect width="100%" height="100%" fill="black"/>
          <text x="0" y="115" font-family="inherit" font-weight="900"
                font-size="110" letter-spacing=".14em"
                fill="transparent" stroke="white" stroke-width="5"
                stroke-linejoin="round" paint-order="stroke">CONTACT</text>
        </mask>
      </defs>

      <text x="0" y="115" font-family="inherit" font-weight="900"
            font-size="110" letter-spacing=".14em"
            fill="transparent" stroke="rgba(255,255,255,.16)"
            stroke-width="5" stroke-linejoin="round" paint-order="stroke">CONTACT</text>

      <rect x="-200" y="-400" width="1400" height="900"
            fill="url(#strokeWave)" mask="url(#textStrokeMask)"/>
    </svg>
  </div>

  <!-- Page JS -->
  <script>
    // Booking form validation (lightweight)
    (function(){
      const form = document.getElementById('bookingForm');
      const status = document.getElementById('formStatus');
      if(!form) return;

      form.addEventListener('submit', function(e){
        e.preventDefault();
        status.textContent = '';
        if (form.website.value) return; // honeypot

        const required = ['name','email','message','consent'];
        for (const key of required) {
          const el = form.querySelector(`[name="${key}"]`);
          if (key === 'consent') {
            if (!el.checked) { el.focus(); status.textContent = 'Please agree to be contacted.'; return; }
          } else if (!el.value.trim()) {
            el.focus(); status.textContent = 'Please fill the required fields.'; return;
          }
        }
        const email = form.email.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.email.focus(); status.textContent = 'Enter a valid email.'; return; }

        form.reset();
        status.textContent = 'Thanks! Your message has been queued. We’ll reply shortly.';
      });
    })();

    // Rotating tagline
    (function(){
      const el = document.getElementById('heroTag');
      if(!el) return;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const phrases = (()=>{ try { return JSON.parse(el.dataset.phrases || '[]'); } catch(_){ return []; } })();
      if(!phrases.length || reduce) return;
      let i = 0;
      const show = (t)=>{ el.style.opacity=0; el.style.transform='translateY(6px)';
        setTimeout(()=>{ el.textContent=t; el.style.opacity=1; el.style.transform='translateY(0)'; },220);
      };
      setInterval(()=>{ i=(i+1)%phrases.length; show(phrases[i]); },3600);
    })();

    // Mark current link in header + popup, and append skip-intro to internal links
    (function(){
      try{
        const here = (location.pathname.replace(/\/+$/, '') || '/contact.html').toLowerCase();
        const mark = scope => scope && scope.querySelectorAll('a[href]').forEach(a=>{
          const p = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '').toLowerCase();
          if (p === here) a.setAttribute('aria-current','page');
        });
        mark(document.querySelector('.links'));
        mark(document.getElementById('nav-pop'));
      }catch(e){}

      document.addEventListener('click', function (e) {
        const a = e.target.closest('a[href]');
        if (!a) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (a.target === '_blank') return;
        const href = a.getAttribute('href') || '';
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;
        const url = new URL(href, location.href);
        if (url.origin !== location.origin) return;
        e.preventDefault();
        url.searchParams.set('skip-intro','1');
        location.assign(url.href);
      }, { capture: true });
    })();
  </script>
</body>
</html>
