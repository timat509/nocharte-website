<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NOCHARTE Daylight — Sports Events</title>
  <meta name="description" content="NOCHARTE Daylight sports event galleries." />

  <!-- Favicons -->
  <link rel="icon" href="../../../websitelogo/weblogo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="../../../websitelogo/weblogo250px.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../../../websitelogo/weblogo250px.png" sizes="180x180">

  <!-- Fonts -->
  <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../../../style.css">
  <link rel="stylesheet" href="../../daylight.css">
  <link rel="stylesheet" href="sports.css">
  <link rel="stylesheet" href="../../../mobile/responsive.css">
</head>

<body class="daylight-page sports-page">

  <header class="nav">
    <a href="../../index.html?skip-intro=1" class="logo daylight-logo" aria-label="NOCHARTE Daylight Home">
      <img src="../../../assets/web/daylight-logo.png" alt="NOCHARTE Daylight logo">
    </a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="links daylight-links daylight-inner-links">
      <a href="../../index.html?skip-intro=1">Home</a>
      <a href="../index.html?skip-intro=1" aria-current="page">Gallery</a>
      <a href="../../../contact.html?skip-intro=1&theme=daylight">Contact</a>
    </nav>
  </header>

  <div id="nav-pop" class="nav-pop" hidden aria-modal="true" role="dialog">
    <div class="nav-pop__overlay" data-close></div>

    <button class="nav-pop__close" aria-label="Close menu" data-close>
      <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="nav-pop__sheet" role="document">
      <nav class="nav-pop__nav" aria-label="Main">
        <a href="../../index.html?skip-intro=1">Home</a>
        <a href="../index.html?skip-intro=1" aria-current="page">Gallery</a>
        <a href="../../../contact.html?skip-intro=1&theme=daylight">Contact</a>
      </nav>
    </div>
  </div>

  <div class="sports-bg"></div>

  <main class="sports-wrap">
    <header class="sports-hero">
      <p class="sports-hero__eyebrow">NOCHARTE DAYLIGHT · SPORTS</p>

      <h1 class="sports-hero__title">
        Sports<br>
        <span>Events</span>
      </h1>

      <p class="sports-hero__subtitle">
        Explore our daylight sports coverage. Select an event and find your photos by day.
      </p>
    </header>

    <h2 class="sports-year-title">2026</h2>
    <p class="sports-hint">Swipe or use arrows to browse the sports events.</p>

    <section class="sports-coverflow floor" aria-label="Sports event albums">
      <button class="float-arrow left" type="button" aria-label="Previous sports event">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 4.5L8 12l7.5 7.5" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
      </button>

      <div class="stage" id="sportsStage"></div>

      <button class="float-arrow right" type="button" aria-label="Next sports event">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 4.5L16 12l-7.5 7.5" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
      </button>
    </section>
  </main>

  <script src="albums.js"></script>

  <script>
    function getCoverFallback(coverPath) {
      return coverPath;
    }

    function getCoverWebp(coverPath) {
      return String(coverPath || '').replace(/\.(jpe?g|png)$/i, '.webp');
    }

    function createCoverflow({ stage, albums, arrowL, arrowR }) {
      let index = 0;
      let downX = null;

      if (!stage) return;

      if (!Array.isArray(albums) || albums.length === 0) {
        stage.innerHTML = `
          <div class="sports-empty">
            <h2>No sports events yet</h2>
            <p>New Daylight sports galleries will appear here soon.</p>
          </div>
        `;

        if (arrowL) arrowL.style.display = "none";
        if (arrowR) arrowR.style.display = "none";
        return;
      }

      stage.innerHTML = albums.map(album => {
        const href = album.href || `${album.slug}/index.html`;
        const cover = album.cover || "";
        const days = album.days && album.days > 1 ? `${album.days} days` : `${album.days || 1} day`;

        return `
          <a class="sports-card" href="${href}?skip-intro=1" aria-label="Open ${album.title}">
            <img
  src="${getCoverWebp(cover)}"
  loading="lazy"
  decoding="async"
  alt="${album.title}"
  onerror="this.classList.add('is-broken');"
>

            <div class="sports-card-placeholder">
              <span>${album.category || "Sports"}</span>
            </div>

            <div class="meta">
              <p class="sports-card-label">${album.type || "Event"} · ${days}</p>
              <h3>${album.title}</h3>
              <p>${album.date || ""} ${album.location ? "• " + album.location : ""}</p>
            </div>
          </a>
        `;
      }).join("");

      const cards = () => [...stage.querySelectorAll(".sports-card")];

      function position() {
        const allCards = cards();
        const cardW = allCards[0]?.offsetWidth || 280;
        const spacing = cardW * 0.78;
        const depth = 140;

        allCards.forEach((card, i) => {
          const o = i - index;
          const a = Math.abs(o);

          card.style.transform =
            `translate3d(calc(-50% + ${o * spacing}px), 0, ${-a * depth}px)
             rotateY(${o * -12}deg)
             scale(${i === index ? 1 : .94})`;

          card.classList.toggle("is-active", i === index);
          card.style.zIndex = 100 - a;
        });

        if (arrowL) arrowL.classList.toggle("is-disabled", index === 0);
        if (arrowR) arrowR.classList.toggle("is-disabled", index === allCards.length - 1);
      }

      const prev = () => {
        if (index > 0) {
          index--;
          position();
        }
      };

      const next = () => {
        if (index < albums.length - 1) {
          index++;
          position();
        }
      };

      if (arrowL) arrowL.onclick = prev;
      if (arrowR) arrowR.onclick = next;

      stage.onpointerdown = e => {
        downX = e.clientX;
      };

      stage.onpointermove = e => {
        if (downX === null) return;

        const dx = e.clientX - downX;

        if (Math.abs(dx) > 40) {
          dx > 0 ? prev() : next();
          downX = e.clientX;
        }
      };

      stage.onpointerup = () => {
        downX = null;
      };

      window.addEventListener("resize", position);

      position();
    }

    const sportsAlbums = Array.isArray(SPORTS_ALBUMS) ? SPORTS_ALBUMS : [];

if (sportsAlbums.length <= 1) {
  document.querySelector(".sports-coverflow")?.classList.add("has-one-card");
}

createCoverflow({
  stage: document.getElementById("sportsStage"),
  albums: sportsAlbums,
  arrowL: document.querySelector(".float-arrow.left"),
  arrowR: document.querySelector(".float-arrow.right")
});
  </script>

  <script src="../../../mobile/mobile.js"></script>
</body>
</html>
