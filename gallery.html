  { slug:"suenos_tour-15-11-25", title:"SUEÑOS TOUR — 15 Nov 2025", date:"2025-11-15", count:67, cover:"/assets/albums/suenos_tour-15-11-25/cover.png" },
  { slug:"santa_blacklist-12-12-25", title:"SANTA'S BLACKLIST — 12 Dec 2025", date:"2025-12-12", count:147, cover:"/assets/albums/santa_blacklist-12-12-25/cover.png" },
  { slug:"80s_night-15-01-26", title:"80's Night Bull Dog Pub — 15 Jan 2026", date:"2026-01-15", count:65, cover:"/assets/albums/80s_night-15-01-26/cover.png" },
  { slug: "pill_in_ibiza-23-01-26", title: "Pill In Ibiza — 23 Jan 2026",date: "2026-01-23",category: "Clubs",count: 172, cover:"/assets/albums/pill_in_ibiza-23-01-26/cover.jpg", href:"album.html?slug=pill_in_ibiza-23-01-26"},
  { slug: "cielo-30-01-26", title: "Cielo — 30 Jan 2026",date: "2026-01-30",category: "Clubs",count: 78,cover: "/assets/albums/cielo-30-01-26/cover.jpg",href: "album.html?slug=cielo-30-01-26"},
  { slug: "do_not_disturb-07-02-26", title: "Do Not Disturb — 07 Feb 2026",date: "2026-02-07", category: "Clubs", count: 101, cover: "/assets/albums/do_not_disturb-07-02-26/cover.jpg", href: "album.html?slug=do_not_disturb-07-02-26"},
  {slug: "lucia_opening-13-02-26", title: "Lucia Opening — 13 Feb 2026",date: "2026-02-13",category: "Clubs",count: 174,cover: "/assets/albums/lucia_opening-13-02-26/cover.jpg",href: "album.html?slug=lucia_opening-13-02-26"},
  {slug: "Welit-12-03-26",title: "We Lit — 12 Mar 2026",date: "2026-03-12", category: "Clubs", count: 100, cover: "/assets/albums/welit-12-03-26/cover.jpg", href: "album.html?slug=welit-12-03-26"},
  {slug: "biblioteca-21-03-26", title: "Biblioteca — 21 Mar 2026",date: "2026-03-21",category: "Clubs",count: 47,cover: "/assets/albums/biblioteca-21-03-26/cover.jpg",href: "album.html?slug=biblioteca-21-03-26"},
  {slug: "black_party-09-04-26", title: "Black Party — 09 Abr 2026",date: "2026-04-09",category: "Clubs",count: 125,cover: "assets/albums/black_party-09-04-26/cover.jpg",href: "album.html?slug=black_party-09-04-26"},
  {slug: "roony_arlene-17-04-26",title: "Roony GTA & Arlene — 17 Abr 2026",date: "2026-04-17",category: "Clubs",count: 125,cover: "assets/albums/roony_arlene-17-04-26/cover.jpg",href: "album.html?album=roony_arlene-17-04-26&skip-intro=1"},
  {slug: "frequencies_v1-16-05-26", title: "Frequencies V1 Santi & Marco — 16 May 2026",date: "2026-05-16",category: "Clubs",count: 162,cover: "assets/albums/frequencies_v1-16-05-26/cover.jpg",href: "album.html?slug=frequencies_v1-16-05-26"},
  {slug: "the_trip-30-05-26", title: "The Trip — 30 May 2026",date: "2026-05-30",category: "Clubs",count: 73,cover: "assets/albums/the_trip-30-05-26/cover.webp",href: "album.html?slug=the_trip-30-05-26"},
  {slug: "light_out-20-06-26", title: "Light Out  — 20 Juin 2026", date: "2026-06-20", category: "Clubs",count: 97,cover: "assets/albums/light_out-20-06-26/cover.webp",href: "album.html?slug=light_out-20-06-26"},
];

function getCoverWebp(coverPath) {
  return String(coverPath).replace(/\.(jpe?g|png)$/i, '.webp');
}

function getCoverFallback(coverPath) {
  return coverPath;
}

const albums2025 = ALBUMS.filter(a => new Date(a.date).getFullYear() === 2025)
  .sort((a,b)=>new Date(b.date)-new Date(a.date));

const albums2026 = ALBUMS.filter(a => new Date(a.date).getFullYear() === 2026)
  .sort((a,b)=>new Date(b.date)-new Date(a.date));

/* =========================
   COVERFLOW FACTORY
========================= */
function createCoverflow({ stage, albums, arrowL, arrowR }) {
  let index = 0;
  let downX = null;

  stage.innerHTML = albums.map(a => `
    <a class="card" href="/album.html?album=${a.slug}">
      <img
  src="${getCoverWebp(a.cover)}"
  loading="lazy"
  decoding="async"
  alt="${a.title}"
  onerror="this.onerror=null; this.src='${getCoverFallback(a.cover)}';">
      <div class="meta">
        <h3>${a.title}</h3>
        <p>${a.date} • ${a.count} photos</p>
      </div>
    </a>
  `).join('');

  const cards = () => [...stage.querySelectorAll('.card')];

  function position() {
    const cardW = cards()[0]?.offsetWidth || 260;
    const spacing = cardW * 0.78;
    const depth = 140;

    cards().forEach((card, i) => {
      const o = i - index;
      const a = Math.abs(o);
      card.style.transform =
        `translate3d(calc(-50% + ${o * spacing}px),0,${-a * depth}px)
         rotateY(${o * -12}deg) scale(${i===index?1:.94})`;
      card.classList.toggle('is-active', i === index);
      card.style.zIndex = 100 - a;
    });
  }

  const prev = () => { if(index>0){ index--; position(); }};
  const next = () => { if(index<albums.length-1){ index++; position(); }};

  arrowL.onclick = prev;
  arrowR.onclick = next;

  stage.onpointerdown = e => downX = e.clientX;
  stage.onpointermove = e => {
    if(downX === null) return;
    const dx = e.clientX - downX;
    if(Math.abs(dx) > 40){
      dx > 0 ? prev() : next();
      downX = e.clientX;
    }
  };
  stage.onpointerup = () => downX = null;

  position();
}

/* =========================
   INIT
========================= */
createCoverflow({
  stage: document.getElementById('stage-2026'),
  albums: albums2026,
  arrowL: document.querySelector('[data-floor="2026"].left'),
  arrowR: document.querySelector('[data-floor="2026"].right')
});

createCoverflow({
  stage: document.getElementById('stage-2025'),
  albums: albums2025,
  arrowL: document.querySelector('[data-floor="2025"].left'),
  arrowR: document.querySelector('[data-floor="2025"].right')
});
</script>

<!-- Mark current link + carry ?skip-intro=1 -->
<script>
  (function(){
    try{
      const here = (location.pathname.replace(/\/+$/, '') || '/gallery.html').toLowerCase();

      const mark = scope => scope && scope.querySelectorAll('a[href]').forEach(a=>{
        const p = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '').toLowerCase();
        if (p === here) a.setAttribute('aria-current','page');
      });

      mark(document.querySelector('.links'));
      mark(document.getElementById('nav-pop'));
    }catch(e){}

    document.addEventListener('click', function (e) {
      const a = e.target.closest('a[href]');
      if (!a) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (a.target === '_blank') return;

      const href = a.getAttribute('href') || '';
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;

      const url = new URL(href, location.href);
      if (url.origin !== location.origin) return;

      e.preventDefault();
      url.searchParams.set('skip-intro','1');
      location.assign(url.href);
    }, { capture: true });
  })();
</script>
