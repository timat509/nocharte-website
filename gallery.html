<!-- ===== PAGE JS ===== -->
<script>
/* =========================
   DATA
========================= */
const ALBUMS = [
  { slug:"luna-19-07-25", title:"Luna — 19 Jul 2025", date:"2025-07-19", count:7, cover:"/assets/albums/luna-19-07-25/cover.png" },
  { slug:"summer-23-08-25", title:"Summer — 23 Aug 2025", date:"2025-08-23", count:48, cover:"/assets/albums/summer-23-08-25/cover.jpeg" },
  { slug:"after_walk-13-09-25", title:"After Walk — 13 Sep 2025", date:"2025-09-13", count:95, cover:"/assets/albums/after_walk-13-09-25/cover.jpeg" },
  { slug:"aj_amazonia-31-10-25", title:"A&J Amazonia — 31 Oct 2025", date:"2025-10-31", count:82, cover:"/assets/albums/aj_amazonia-31-10-25/cover.png" },
  { slug:"suenos_tour-15-11-25", title:"SUEÑOS TOUR — 15 Nov 2025", date:"2025-11-15", count:67, cover:"/assets/albums/suenos_tour-15-11-25/cover.png" },
  { slug:"santa_blacklist-12-12-25", title:"SANTA'S BLACKLIST — 12 Dec 2025", date:"2025-12-12", count:147, cover:"/assets/albums/santa_blacklist-12-12-25/cover.png" },
  { slug:"80s_night-15-01-26", title:"80's Night Bull Dog Pub — 15 Jan 2026", date:"2026-01-15", count:65, cover:"/assets/albums/80s_night-15-01-26/cover.png" },
  { slug: "pill_in_ibiza-23-01-26", title: "Pill In Ibiza — 23 Jan 2026",date: "2026-01-23",category: "Clubs",count: 172, cover:"assets/albums/pill_in_ibiza-23-01-26/cover.jpg", href:"album.html?slug=pill_in_ibiza-23-01-26"
  }
];

const albums2025 = ALBUMS.filter(a => new Date(a.date).getFullYear() === 2025)
  .sort((a,b)=>new Date(b.date)-new Date(a.date));

const albums2026 = ALBUMS.filter(a => new Date(a.date).getFullYear() === 2026)
  .sort((a,b)=>new Date(b.date)-new Date(a.date));

/* =========================
   COVERFLOW FACTORY
========================= */
function createCoverflow({ stage, albums, arrowL, arrowR }) {
  let index = 0;
  let downX = null;

  stage.innerHTML = albums.map(a => `
    <a class="card" href="/album.html?album=${a.slug}">
      <img src="${a.cover}" loading="lazy">
      <div class="meta">
        <h3>${a.title}</h3>
        <p>${a.date} • ${a.count} photos</p>
      </div>
    </a>
  `).join('');

  const cards = () => [...stage.querySelectorAll('.card')];

  function position() {
    const cardW = cards()[0]?.offsetWidth || 260;
    const spacing = cardW * 0.78;
    const depth = 140;

    cards().forEach((card, i) => {
      const o = i - index;
      const a = Math.abs(o);
      card.style.transform =
        `translate3d(calc(-50% + ${o * spacing}px),0,${-a * depth}px)
         rotateY(${o * -12}deg) scale(${i===index?1:.94})`;
      card.classList.toggle('is-active', i === index);
      card.style.zIndex = 100 - a;
    });
  }

  const prev = () => { if(index>0){ index--; position(); }};
  const next = () => { if(index<albums.length-1){ index++; position(); }};

  arrowL.onclick = prev;
  arrowR.onclick = next;

  stage.onpointerdown = e => downX = e.clientX;
  stage.onpointermove = e => {
    if(downX === null) return;
    const dx = e.clientX - downX;
    if(Math.abs(dx) > 40){
      dx > 0 ? prev() : next();
      downX = e.clientX;
    }
  };
  stage.onpointerup = () => downX = null;

  position();
}

/* =========================
   INIT
========================= */
createCoverflow({
  stage: document.getElementById('stage-2026'),
  albums: albums2026,
  arrowL: document.querySelector('[data-floor="2026"].left'),
  arrowR: document.querySelector('[data-floor="2026"].right')
});

createCoverflow({
  stage: document.getElementById('stage-2025'),
  albums: albums2025,
  arrowL: document.querySelector('[data-floor="2025"].left'),
  arrowR: document.querySelector('[data-floor="2025"].right')
});
</script>
