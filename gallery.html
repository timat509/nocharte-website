<body class="page-gallery">
  <!-- HEADER -->

    <!-- Desktop links -->
    <nav class="links" role="navigation" aria-label="Main">

  <!-- POPUP MENU (mobile) -->

    </button>
    <div class="nav-pop__sheet" role="document">
      <nav class="nav-pop__nav" aria-label="Main">
        <a href="/index.html">Home</a>
        <a href="/gallery.html">Gallery</a>
        <a href="/about.html">About</a>

    </div>
  </div>

  <!-- BACKGROUND -->

  <div class="gal-vignette"></div>
  <div class="gal-stars" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>

  <!-- FLOAT ARROWS -->
  <button class="float-arrow left" aria-label="Previous album">

    </svg>
  </button>

  <!-- MAIN -->
  <main class="wrap">
    <header class="hero-head">
      <h1>Albums</h1>
      <div class="filters">
        <button class="pill is-active" disabled>All</button>
      </div>
    </header>

    <section class="coverflow" aria-label="Album carousel">
      <div class="stage" id="stage" role="listbox" aria-live="polite"></div>
    </section>

    <footer class="below">
      <div class="info">
        <h2 id="albumTitle">—</h2>
        <p id="albumDate">—</p>
      </div>
      <a id="openAlbum" class="btn" href="#">Open Album</a>
    </footer>
  </main>

  <!-- PAGE JS -->
  <script>
    // ----- Data -----
    // ----- Data -----
let ALBUMS = [
  { slug:"luna-19-07-25",   title:"Luna — 19 Jul 2025",   date:"Jul 19, 2025", count:"7",
    cover:"/assets/albums/luna-19-07-25/cover.png" },

  { slug:"summer-23-08-25", title:"Summer — 23 Aug 2025", date:"Aug 23, 2025", count:"48",
    cover:"/assets/albums/summer-23-08-25/cover.jpeg" },

  { slug:"after_walk-13-09-25", title:"After Walk — 13 Sep 2025", date:"Sep 13, 2025", count:"95",
    cover:"/assets/albums/after_walk-13-09-25/cover.jpeg" },

  { slug:"aj_amazonia-31-10-25", title:"A&J Amazonia — 31 Oct 2025",
    date:"Oct 31, 2025", count:"82",
    cover:"/assets/albums/aj_amazonia-31-10-25/cover.png" },

  { slug:"suenos_tour-15-11-25", title:"SUEÑOS TOUR — 15 Nov 2025",
    date:"Nov 15, 2025", count:"67",
    cover:"/assets/albums/suenos_tour-15-11-25/cover.png" },
  { slug: "santa_blacklist-12-12-25", title: "SANTA'S BLACKLIST — 12 Dec 2025",
    date: "2025-12-12", category: "Clubs", count: 177,
    cover: "assets/albums/santa_blacklist-12-12-25/cover.png",}
];

// Newest first
ALBUMS.sort((a, b) => new Date(b.date) - new Date(a.date));

    const stage      = document.getElementById('stage');
    const albumTitle = document.getElementById('albumTitle');
    const albumDate  = document.getElementById('albumDate');
    const openAlbum  = document.getElementById('openAlbum');
    const arrowL     = document.querySelector('.float-arrow.left');
    const arrowR     = document.querySelector('.float-arrow.right');

    // Stars
    document.querySelectorAll('.gal-stars span').forEach(s=>{
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.opacity = (Math.random()*0.7+0.2).toFixed(2);
      s.style.width = s.style.height = (Math.random()*3+1) + 'px';
    });

    let index = 0;

    function render(){
      stage.innerHTML = ALBUMS.map(a => `
        <a class="card"
           role="option"
           href="/album.html?album=${encodeURIComponent(a.slug)}"
           data-slug="${a.slug}"
           data-title="${a.title}"
           aria-label="Open ${a.title}">
          <img src="${a.cover}" alt="${a.title} album cover" loading="lazy" />
          <div class="meta"><h3>${a.title}</h3><p>${a.date} • ${a.count} photos</p></div>
        </a>
      `).join('');
      addCardClickHandlers();
      positionCards();
    }

    function positionCards(){
      const cards = Array.from(stage.querySelectorAll('.card'));
      if (!cards.length) return;

      const cardW = cards[0].offsetWidth || 300;
      const spacing = cardW * 0.78;
      const depthStep = 140;

      cards.forEach((card, i) => {
        const offset = i - index;
        const abs = Math.abs(offset);
        const tx = offset * spacing;
        const tz = -abs * depthStep;
        const ry = offset * -12;
        const sc = i === index ? 1 : 0.94;

        // Center stack: anchor card at left:50% and translateX(calc(-50% + tx))
        card.style.transform =
          `translate3d(calc(-50% + ${tx}px), 0, ${tz}px) rotateY(${ry}deg) scale(${sc})`;

        card.style.zIndex = String(100 - abs);
        card.classList.toggle('is-active', i === index);
      });

      const active = ALBUMS[index];
      albumTitle.textContent = active.title;
      albumDate.textContent  = `${active.date} • ${active.count} photos`;
      openAlbum.href = `/album.html?album=${encodeURIComponent(active.slug)}`;

      arrowL.classList.toggle('is-disabled', index === 0);
      arrowR.classList.toggle('is-disabled', index === ALBUMS.length - 1);
    }

    function prev(){ if(index>0){ index--; positionCards(); } }
    function next(){ if(index<ALBUMS.length-1){ index++; positionCards(); } }

    // Drag-to-swipe
    let downX = null, isDragging = false;
    stage.addEventListener('pointerdown', e => { downX = e.clientX; isDragging = false; });
    stage.addEventListener('pointermove', e => {
      if (downX == null) return;
      const dx = e.clientX - downX;
      if (!isDragging && Math.abs(dx) > 12) isDragging = true;
      if (isDragging && Math.abs(dx) > 40) { (dx > 0 ? prev() : next()); downX = e.clientX; }
    });
    stage.addEventListener('pointerup',   () => { downX = null; isDragging = false; });
    stage.addEventListener('pointerleave',() => { downX = null; isDragging = false; });

    // Click → navigate (keep skip-intro)
    function addCardClickHandlers(){
      stage.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', (ev) => {
          if (isDragging) { ev.preventDefault(); return; }
          ev.preventDefault();
          const url = new URL(card.href, location.href);
          url.searchParams.set('skip-intro','1');
          location.assign(url.href);
        });
      });
    }

    // Buttons + keys
    arrowL.addEventListener('click', prev);
    arrowR.addEventListener('click', next);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });

    // Mark current link
    (function markCurrent(){
      const here = (location.pathname.replace(/\/+$/, '') || '/gallery.html').toLowerCase();
      document.querySelectorAll('.links a[href], #nav-pop a[href]').forEach(a=>{
        const p = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '').toLowerCase();
        if (p === here) a.setAttribute('aria-current','page');
      });
    })();

    // Add ?skip-intro=1 to internal links
    document.addEventListener('click', function (e) {
      const a = e.target.closest('a[href]');
      if (!a) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (a.target === '_blank') return;
      const href = a.getAttribute('href') || '';
      if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) return;
      const url = new URL(href, location.href);
      if (url.origin !== location.origin) return;
      e.preventDefault();
      url.searchParams.set('skip-intro','1');
      location.assign(url.href);
    }, { capture: true });

    // Popup open/close (mobile)
    (function () {
      const toggle = document.querySelector('.nav-toggle');
      const pop = document.getElementById('nav-pop');
      if (!toggle || !pop) return;

      function open() {
        pop.hidden = false;
        requestAnimationFrame(() => {
          pop.classList.add('is-open');
          document.body.classList.add('menu-open');
          toggle.setAttribute('aria-expanded', 'true');
        });
      }
      function closeAll() {
        pop.classList.remove('is-open');
        document.body.classList.remove('menu-open');
        toggle.setAttribute('aria-expanded', 'false');
        setTimeout(() => { pop.hidden = true; }, 180);
      }
      if (!toggle.dataset.bound) {
        toggle.dataset.bound = '1';
        toggle.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          pop.hidden ? open() : closeAll();
        }, { passive: true });
      }
      pop.addEventListener('click', (e) => {
        if (e.target.hasAttribute('data-close') || e.target.closest('[data-close]')) closeAll();
      });
      addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
      pop.querySelectorAll('a').forEach(a => a.addEventListener('click', () => closeAll()));
    })();

    // Init
    addEventListener('load', render);
    addEventListener('resize', positionCards);
  </script>
</body>
