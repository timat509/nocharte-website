  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>NOCHARTE — Intro</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="canonical" href="https://nocharte.com/">

<link rel="preload" as="video" href="assets/web/Intromobile.mp4" type="video/mp4" media="(max-aspect-ratio: 3/4)">
<link rel="preload" as="video" href="assets/web/intro.mp4" type="video/mp4" media="(min-aspect-ratio: 3/4)">

<noscript>
  <meta http-equiv="refresh" content="0;url=/index.html?skip-intro=1">
</noscript>


  <!-- (Optional) site CSS; not required for this page -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mobile/responsive.css" />

  <style>
    :root{ --mag:#d403e0; --vio:#7d00ff; }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0;
      background:#000; color:#fff;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
    }

    /* Stage & media */
    #stage{ position:fixed; inset:0; }
    .hero-video{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: cover;            /* fills screen on desktop & wide phones */
      object-position: center;
      background:#000;
    }
    .poster{
      position:absolute; inset:0;
      background:#000 center/cover no-repeat;
      opacity:0; transition:opacity .3s ease;
    }

    /* Skip button */
    .skip{
      position:fixed; z-index:3;
      right:18px; bottom:18px;
      padding:10px 14px;
      border-radius:999px; font-weight:800;
      background:linear-gradient(90deg,var(--mag),var(--vio));
      color:#fff; text-decoration:none;
      box-shadow:0 12px 26px rgba(212,3,224,.25);
    }

    /* Phones/tablets: respect safe areas */
    @media (max-width: 820px){
      .skip{
        right: max(14px, env(safe-area-inset-right));
        bottom: max(14px, calc(env(safe-area-inset-bottom) + 10px));
      }
    }

    /* Ultra-tall portrait screens */
    @media (max-aspect-ratio: 3/4){
      .hero-video{ object-fit: cover !important; }
    }

    /* Reduced motion: hide video; we’ll auto-skip */
    @media (prefers-reduced-motion: reduce){
      .hero-video{ display:none !important; }
    }
  </style>
</head>
<body>
  <section id="stage" aria-label="Intro">
    <!-- Poster (shows briefly while video buffers) -->
    <div id="poster" class="poster" style="background-image:url('assets/intro-poster.jpg')"></div>

    <!-- Video: portrait source first for tall screens, then default -->
    <video id="introVid" class="hero-video" playsinline webkit-playsinline muted autoplay preload="auto">
      <source src="assets/web/Intromobile.mp4" media="(max-aspect-ratio: 3/4)" type="video/mp4" />
      <source src="assets/web/intro.mp4" type="video/mp4" />
    </video>

    <a class="skip" href="index.html?skip-intro=1">Skip</a>
  </section>

  <script>
  (function(){
    const REDIRECT = "index.html?skip-intro=1";
    const video   = document.getElementById('introVid');
    const poster  = document.getElementById('poster');
    const stage   = document.getElementById('stage');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Safari guard: some builds ignore <source media>. Pick the file ourselves. */
    try {
      const tall = matchMedia('(max-aspect-ratio: 3/4)').matches;
      const prefer = tall ? 'assets/web/Intromobile.mp4' : 'assets/web/intro.mp4';
      if (!video.currentSrc || !video.currentSrc.endsWith(prefer)) {
        video.src = prefer;        // add ?v=1 while testing to bust cache if needed
        video.load();
      }
    } catch {}

    function markPlayed(){ try { sessionStorage.setItem('nocharte_intro_played','1'); } catch(e){} }
    function fadeAndGo(){
      markPlayed();
      stage.style.transition = 'opacity .45s ease';
      stage.style.opacity = '0';
      setTimeout(()=>location.replace(REDIRECT), 460);
    }

    if (reduced){
      setTimeout(fadeAndGo, 600);
      return;
    }

    // Show poster if video takes a moment to buffer
    let posterTimer = setTimeout(()=>{ poster.style.opacity = '1'; }, 120);

    // Try to play, fall back to skip if autoplay blocked
    function ensurePlay(){
      try {
        const p = video.play?.();
        if (p && p.catch) p.catch(()=>fadeAndGo());
      } catch {
        fadeAndGo();
      }
    }

    // Precise failsafe once we know the duration
    let failsafe = setTimeout(fadeAndGo, 9000);
    video.addEventListener('loadedmetadata', () => {
      clearTimeout(failsafe);
      const dur = isFinite(video.duration) ? video.duration * 1000 : 8000;
      failsafe = setTimeout(fadeAndGo, Math.max(3000, dur + 400)); // duration + cushion
      ensurePlay();
    }, { once:true });

    video.addEventListener('canplay', () => {
      clearTimeout(posterTimer);
      poster.style.opacity = '0';
      ensurePlay();
    }, { once:true });

    video.addEventListener('ended', fadeAndGo);

    // Extra guard if metadata never loads
    setTimeout(()=>{ if (video.paused || isNaN(video.duration)) fadeAndGo(); }, 12000);
  })();
  </script>
</body>
</html>
